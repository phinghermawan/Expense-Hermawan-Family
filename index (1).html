<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6d28d9">
  <title>Expense Hermawan Family</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f6f4ff; }
    .topbar { min-height: 54px; padding: 9px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; color: #fff; background: linear-gradient(110deg,#6d28d9,#c026d3,#3b82f6); }
    .brand { font-size: 14px; font-weight: 800; letter-spacing: .2px; }
    .open { display: inline-block; color: #5b21b6; background: #fff; border-radius: 999px; padding: 8px 13px; text-decoration: none; font-size: 12px; font-weight: 750; white-space: nowrap; }
    main { height: calc(100% - 54px); position: relative; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    .hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); max-width: calc(100% - 24px); padding: 8px 12px; border-radius: 10px; background: rgba(30,27,75,.88); color: #fff; font-size: 11px; text-align: center; pointer-events: none; }
    @media (max-width: 480px) { .brand { font-size: 12px; } .open { font-size: 11px; padding: 7px 10px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Expense Hermawan Family</div>
    <a class="open" href="https://script.google.com/macros/s/AKfycbyjItiVJ1U9noYdeWVQSH0o0y1o09Sv3hL52Xza0g15-_YmBWBefQOBlHoAFOZtcNrv/exec" target="_blank" rel="noopener noreferrer">Open app separately ↗</a>
  </header>
  <main>
    <iframe
      src="https://script.google.com/macros/s/AKfycbyjItiVJ1U9noYdeWVQSH0o0y1o09Sv3hL52Xza0g15-_YmBWBefQOBlHoAFOZtcNrv/exec"
      title="Expense Hermawan Family application"
      allow="clipboard-read; clipboard-write"
      loading="eager">
    </iframe>
    <div class="hint">If the app does not appear or asks you to sign in, choose “Open app separately”.</div>
  </main>
</body>
</html>
